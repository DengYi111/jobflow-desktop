name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: 检查与测试
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: 启用 pnpm
        run: corepack enable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行质量检查
        run: pnpm run verify
